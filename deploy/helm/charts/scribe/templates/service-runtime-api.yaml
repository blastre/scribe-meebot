{{- if .Values.runtimeApi.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "scribe.componentName" (list . "runtime-api") }}
  labels:
    {{- include "scribe.labels" . | nindent 4 }}
spec:
  type: {{ .Values.runtimeApi.service.type }}
  ports:
    - name: http
      port: {{ .Values.runtimeApi.service.port }}
      targetPort: http
  selector:
    {{- include "scribe.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: runtime-api
{{- end }}
