{{ if not .Values.scribe.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "scribe-lite.secretName" . }}
  labels:
{{ include "scribe-lite.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "scribe.databaseUrl is required (or set scribe.existingSecret)" .Values.scribe.databaseUrl | quote }}
  ADMIN_API_TOKEN: {{ required "scribe.adminApiToken is required (or set scribe.existingSecret)" .Values.scribe.adminApiToken | quote }}
  TRANSCRIPTION_SERVICE_TOKEN: {{ required "scribe.transcriptionServiceToken is required (or set scribe.existingSecret)" .Values.scribe.transcriptionServiceToken | quote }}
{{ range $key, $val := .Values.scribe.extraSecretEnv }}
  {{ $key }}: {{ $val | quote }}
{{ end }}
{{ end }}
