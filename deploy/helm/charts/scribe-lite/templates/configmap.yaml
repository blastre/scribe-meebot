apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "scribe-lite.configmapName" . }}
  labels:
{{ include "scribe-lite.labels" . | nindent 4 }}
data:
  ORCHESTRATOR: {{ .Values.scribe.orchestrator | quote }}
{{ if .Values.scribe.transcriptionServiceUrl }}
  TRANSCRIPTION_SERVICE_URL: {{ .Values.scribe.transcriptionServiceUrl | quote }}
{{ end }}
{{ if .Values.scribe.dbSslMode }}
  DB_SSL_MODE: {{ .Values.scribe.dbSslMode | quote }}
{{ end }}
{{ range $key, $val := .Values.scribe.extraEnv }}
  {{ $key }}: {{ $val | quote }}
{{ end }}
